name: Terraform CI - Plan

on:
  push:
    branches:
      - feature/3rdrg_add

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Parent module"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="Terraform.tfvars"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view --base main --head feature/3rdrg_add >/dev/null 2>&1; then
            echo "Pull Request already exists. No new PR created."
          else
            gh pr create \
              --base main \
              --head feature/3rdrg_add \
              --title "Terraform Changes - feature/3rdrg_add" \
              --body "Terraform plan completed successfully. Please review and approve this PR."
          fi