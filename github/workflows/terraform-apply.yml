name: Terraform CD - Apply

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  terraform-apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: Parent module

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 5. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 6. Terraform Apply
      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="Terraform.tfvars" \
            -auto-approve